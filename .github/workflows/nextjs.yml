name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next
      - name: Install dependencies
        run: pnpm install
      - name: Build with Next.js
        run: pnpm build
        env:
          NODE_ENV: production
      - name: Debug Build Output
        run: |
          echo "Current directory contents:"
          ls -la
          echo "Output directory contents (if exists):"
          ls -la out || echo "Output directory not found"
          echo "Next.js directory contents (if exists):"
          ls -la .next || echo ".next directory not found"
      - name: Ensure .nojekyll file exists
        run: touch out/.nojekyll
      - name: Fix image paths (if needed)
        run: |
          echo "Fixing image paths in HTML files for GitHub Pages deployment..."
          # Create a simple sed command to replace image paths in HTML files
          cd out
          # Replace src="/... with src="/above/... but only for images, not for CSS or JS
          find . -name "*.html" -exec sed -i 's/src="\([^"]*\.\(png\|jpg\|jpeg\|gif\|webp\|svg\|ico\)\)"/src="\/above\1"/g' {} \;
          # Be careful with href attributes - only modify page links, not CSS/JS asset links
          find . -name "*.html" -exec sed -i 's/href="\(\/[^"_][^"]*\)"/href="\/above\1"/g' {} \;
          # Don't modify _next/ references which are CSS/JS assets
          echo "Path fixing completed."
      - name: Verify static files output
        run: ls -la out || echo "Output directory not found"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4